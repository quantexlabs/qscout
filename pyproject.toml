[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "qscout"
version = "0.2.0"
description = "Offline evidence fusion for post-quantum cryptography inventory"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
authors = [{ name = "QuanteX Labs Inc." }]
keywords = ["pqc", "cryptography", "cbom", "cyclonedx", "inventory"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Typing :: Typed",
]
dependencies = [
    "cryptography>=42.0.0",
    "jinja2>=3.1.0",
    "pydantic>=2.0.0",
    "pyyaml>=6.0.0",
    "typer>=0.12.0",
]

[project.optional-dependencies]
dev = [
    "jsonschema>=4.20.0",
    "mypy>=1.8.0",
    "pyright>=1.1.350",
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
    "types-PyYAML>=6.0.0",
]

[project.scripts]
qscout = "qscout.cli:app"

[project.urls]
Homepage = "https://github.com/quantexlabs/qscout"
Documentation = "https://github.com/quantexlabs/qscout#readme"
Repository = "https://github.com/quantexlabs/qscout"

[tool.hatch.build.targets.wheel]
packages = ["src/qscout"]

[tool.hatch.build.targets.sdist]
only-include = ["src/qscout", "tests", "README.md", "LICENSE"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"src/qscout/cli.py" = ["B008"]
"tests/fixtures/**" = ["F401", "E501"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
packages = ["qscout"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[tool.pyright]
include = ["src"]
pythonVersion = "3.12"
typeCheckingMode = "standard"
reportMissingTypeStubs = false
reportUnknownMemberType = false
reportUnknownVariableType = false
reportUnknownArgumentType = false
reportUntypedFunctionDecorator = false
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "no_network: tests that must not perform network I/O",
]

[tool.coverage.run]
source = ["qscout"]
branch = true
omit = ["tests/*"]

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = false
